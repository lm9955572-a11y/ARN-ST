<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ARN STUDIO: أداة لتصميم بوستات المدرسة بقوالب جاهزة ودمج الصور وإضافة شعار المدرسة والوزارة.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#050b1f">
<meta property="og:title" content="ARN STUDIO | مصمم بوستات المدرسة">
<meta property="og:description" content="صمّم بوستات المدرسة بسهولة: ارفع صورتين، اختر القالب، واحفظ البوست.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎨%3C/text%3E%3C/svg%3E">
<title>ARN STUDIO | مصمم بوستات المدرسة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b1f;--card:#0d1a38;--line:#22345f;--tx:#f2f5ff;--mut:#93a1c6;--gold:#e0b45a;--teal:#3fd0c9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b1f}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 50% -10%,#14295a,var(--bg));color:var(--tx);font-family:Tajawal,Tahoma,sans-serif;min-height:100vh}
header{text-align:center;padding:26px 16px 6px}
.brand{font-family:Tajawal,sans-serif;font-weight:800;font-size:34px;letter-spacing:6px;direction:ltr;background:linear-gradient(90deg,var(--gold),#fff3c8,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--mut);margin:6px 0 0;font-size:15px}
main{max-width:1040px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
@media(max-width:800px){
  main{display:flex;flex-direction:column}
  main>section:last-child{order:-1;position:sticky;top:0;z-index:20;align-self:stretch;width:100%;margin:-16px -16px 0;padding:8px 16px;background:rgba(5,11,31,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  main>section:last-child .prev{position:static}
  main>section:last-child .card{margin:0;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) 106px;grid-template-rows:auto 1fr;gap:4px 12px;align-items:center}
  main>section:last-child .card h2{grid-column:1;grid-row:1;margin:0}
  main>section:last-child canvas{grid-column:2;grid-row:1 / span 2;width:100%;max-width:106px;max-height:190px}
  main>section:last-child .dl{grid-column:1;grid-row:2;margin-top:0;padding:10px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
main>section:last-child .card{margin:0}
.card h2{margin:0 0 12px;font-size:16px;color:var(--gold)}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer;color:var(--mut);font-size:14px;min-height:92px;position:relative;overflow:hidden}
.drop:hover{border-color:var(--teal)}
.drop input{display:none}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop b{display:block;color:var(--tx);margin:12px 0 4px}
.chg{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:rgba(5,11,31,.85);color:#fff;border-radius:99px;padding:3px 12px;font-size:12px;display:none;z-index:2;white-space:nowrap}
.rm{position:absolute;top:6px;left:6px;width:28px;height:28px;padding:0;margin:0;border-radius:50%;background:rgba(5,11,31,.85);color:#fff;display:none;z-index:2}
.drop.has .chg{display:block}.drop.has .rm{display:block}
label.f{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],textarea,select{width:100%;background:#091329;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:10px;font:inherit}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:#091329;padding:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tp{border:2px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;text-align:center;font-size:12px;color:var(--mut);background:#091329}
.tp.on{border-color:var(--gold);color:var(--tx)}
.tp i{display:block;height:56px;border-radius:8px;margin-bottom:6px;position:relative;overflow:hidden}
.tp i:after{content:"";position:absolute;inset:8px 14px;border-radius:4px;background:rgba(255,255,255,.18)}
.tp i.ministry:after{inset:8px 14px;background:linear-gradient(180deg,rgba(255,255,255,.12) 0 28%,rgba(255,255,255,.28) 28% 75%,rgba(255,255,255,.08) 75%)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;width:100%;margin-top:10px}
.ai{background:linear-gradient(90deg,var(--teal),#5b8cff);color:#04122b}
.dl{background:var(--gold);color:#241800}
.sw{background:transparent;border:1px solid var(--line);color:var(--mut);margin-top:8px;font-size:13px;padding:8px}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;color:var(--mut);min-height:18px;margin-top:8px}
.prev{display:flex;flex-direction:column;align-items:center;position:sticky;top:12px}
canvas{width:100%;max-width:380px;height:auto;aspect-ratio:9/16;border-radius:14px;border:1px solid var(--line);background:#07122b}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px;direction:ltr;letter-spacing:2px}
</style>
</head>
<body>
<header>
  <div class="brand">ARN STUDIO</div>
  <p>مصمم بوستات المدرسة · مدعوم بالذكاء الاصطناعي</p>
</header>
<main>
<section>
  <div class="card">
    <h2>١ · الصور</h2>
    <div class="row">
      <label class="drop" id="d1"><input type="file" accept="image/*" id="p1"><b>الصورة الأولى</b>اضغط للرفع<span class="chg">✎ تغيير الصورة</span><button type="button" class="rm" title="إزالة">✕</button></label>
      <label class="drop" id="d2"><input type="file" accept="image/*" id="p2"><b>الصورة الثانية</b>اضغط للرفع<span class="chg">✎ تغيير الصورة</span><button type="button" class="rm" title="إزالة">✕</button></label>
    </div>
    <button class="sw" id="swap">⇅ تبديل ترتيب الصورتين</button>
  </div>
  <div class="card">
    <h2>٢ · القالب</h2>
    <div class="tpls" id="tpls"></div>
  </div>
  <div class="card">
    <h2>٣ · الدمج بين الصور</h2>
    <label class="f"><span>قوة الدمج</span><span id="v1">180</span></label>
    <input type="range" id="fs" min="0" max="320" value="180">
    <label class="f"><span>نمط الدمج</span></label>
    <select id="fstyle">
      <option value="smooth">ناعم</option>
      <option value="linear">خطي</option>
      <option value="soft">سريع التلاشي</option>
      <option value="strong">قوي (يبقى داكنًا أطول)</option>
    </select>
    <label class="f"><span>لون الدمج</span></label>
    <input type="color" id="bc" value="#07122b">
    <label class="f"><span>تلوين الصور بلون الدمج</span><span id="v2">0%</span></label>
    <input type="range" id="tint" min="0" max="60" value="0">
    <label class="f"><span>المسافة بين الصورتين</span><span id="v3">20</span></label>
    <input type="range" id="gap" min="0" max="80" value="20">
    <div class="msg">في القوالب ذات البطاقات يتحول «قوة الدمج» إلى استدارة الحواف.</div>
  </div>
  <div class="card">
    <h2>٤ · النص</h2>
    <label class="f"><span>وصف المناسبة (اختياري، يساعد الذكاء الاصطناعي)</span></label>
    <textarea id="desc" rows="2" placeholder="مثال: تكريم الطالب المتميز في الأنشطة الإعلامية"></textarea>
    <button class="ai" id="aiBtn">✨ اكتب العنوان بالذكاء الاصطناعي</button>
    <label class="f"><span>العنوان</span></label>
    <input type="text" id="title" value="شهادة شكر وتقدير">
    <label class="f"><span>سطر فرعي</span></label>
    <input type="text" id="sub" value="ثانوية حمزة بن عبدالمطلب">
    <div class="msg" id="msg"></div>
  </div>
</section>
<section>
  <div class="card prev">
    <h2>المعاينة</h2>
    <canvas id="cv" width="1080" height="1920"></canvas>
    <button class="dl" id="dl" disabled>⬇ حفظ الصورة</button>
  </div>
</section>
</main>
<footer>ARN STUDIO</footer>

 {n:'بنفسجي ليلي',top:'#0a0518',mid:'#1a0f3a',acc:'#ffd27a',sub:'#dcd3f5',lay:'stack'},
 {n:'بطاقات كحلي',top:'#030818',mid:'#0a1a3d',acc:'#e0b45a',sub:'#c9d4f2',lay:'cards'},

let ti=0;
function buildTpls(){
  $('tpls').innerHTML='';
  TPL.forEach((t,i)=>{
    const d=document.createElement('div');d.className='tp'+(i===ti?' on':'');
    const swatch=t.lay==='ministry'
      ?'linear-gradient(180deg,#0c3d45 0 25%,#dfd4b9 25% 76%,#2e91aa 76% 100%)'
      :`linear-gradient(${t.top},${t.mid})`;
    d.innerHTML=`<i class="${t.lay==='ministry'?'ministry':''}" style="background:${swatch}"></i>${t.n}`;
    d.onclick=()=>{ti=i;$('bc').value=t.blend||t.mid;buildTpls();draw()};
    $('tpls').appendChild(d);
  });
}
function load(inp,key,drop){
  $(inp).addEventListener('change',async e=>{
    const f=e.target.files[0]; if(!f)return;
    files[key]=f;
    const url=URL.createObjectURL(f);
    const im=new Image(); im.src=url; await im.decode(); imgs[key]=im;
    setThumb(drop,url);e.target.value='';
    draw();
  });
}
function setThumb(d,src){
  let t=$(d).querySelector('img');
  if(src){if(!t){t=document.createElement('img');$(d).appendChild(t)}t.src=src;$(d).classList.add('has')}
  else{if(t)t.remove();$(d).classList.remove('has')}
}

document.querySelectorAll('.rm').forEach(b=>b.addEventListener('click',e=>{

}));
$('swap').onclick=()=>{
  [imgs.a,imgs.b]=[imgs.b,imgs.a];[files.a,files.b]=[files.b,files.a];
  const i1=$('d1').querySelector('img'),i2=$('d2').querySelector('img');
  const s1=i1&&i1.src,s2=i2&&i2.src;
  setThumb('d1',s2);setThumb('d2',s1);
  draw();
};
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
const EASE={linear:t=>t,smooth:t=>t*t*(3-2*t),soft:t=>1-Math.pow(1-t,3),strong:t=>Math.pow(t,3)};
// fade a rect's edge into color: opaque at the edge, transparent inward
function edge(rx,ry,rw,rh,from,size,color,style){
  if(size<=0)return;
  const e=EASE[style];let x0,y0,x1,y1;
  if(from==='top'){x0=0;y0=ry;x1=0;y1=ry+size;}
  if(from==='bottom'){x0=0;y0=ry+rh;x1=0;y1=ry+rh-size;}
  if(from==='left'){x0=rx;y0=0;x1=rx+size;y1=0;}
  if(from==='right'){x0=rx+rw;y0=0;x1=rx+rw-size;y1=0;}
  const g=ctx.createLinearGradient(x0,y0,x1,y1);
  for(let i=0;i<=12;i++){const t=i/12;g.addColorStop(t,rgba(color,1-e(t)))}
  ctx.save();ctx.beginPath();ctx.rect(rx,ry,rw,rh);ctx.clip();ctx.fillStyle=g;ctx.fillRect(rx,ry,rw,rh);ctx.restore();
}
function cover(im,x,y,w,h){
  const s=Math.max(w/im.width,h/im.height),sw=w/s,sh=h/s;
  ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,x,y,w,h);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function photo(im,label,x,y,w,h,tint,color,radius){
  ctx.save();rr(x,y,w,h,radius||0);ctx.clip();
  if(im)cover(im,x,y,w,h);
  else{ctx.fillStyle='#0d1a38';ctx.fillRect(x,y,w,h);ctx.fillStyle='#4a5c8a';ctx.textAlign='center';ctx.font='700 44px Tajawal,sans-serif';ctx.fillText(label,x+w/2,y+h/2)}
  if(tint>0){ctx.fillStyle=rgba(color,tint);ctx.fillRect(x,y,w,h)}
  ctx.restore();
}
function tintImage(im,color){
  if(!im)return null;
  const c=document.createElement('canvas');
  c.width=im.naturalWidth||im.width;c.height=im.naturalHeight||im.height;
  const cctx=c.getContext('2d');
  if(!cctx)return im;
  cctx.drawImage(im,0,0);
  cctx.globalCompositeOperation='source-in';
  cctx.fillStyle=color;cctx.fillRect(0,0,c.width,c.height);
  return c;
}
function fit(text,max,size,weight){
  do{ctx.font=`${weight} ${size}px Tajawal,Tahoma,sans-serif`;size-=2}while(ctx.measureText(text).width>max&&size>20);
}
async function draw(){
  try{await document.fonts.load('800 40px Tajawal')}catch(e){}
  const t=TPL[ti],bc=$('bc').value,fs=+$('fs').value,st=$('fstyle').value,tint=$('tint').value/100,gap=+$('gap').value;
  $('v1').textContent=fs;$('v2').textContent=$('tint').value+'%';$('v3').textContent=gap;
  ctx.direction='rtl';ctx.textAlign='center';
  if(t.lay==='ministry'){
    ctx.fillStyle=bc;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=t.top;ctx.fillRect(0,0,W,260);
    ctx.fillStyle=t.mid;ctx.fillRect(0,1740,W,H-1740);
  }else{
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,t.top);bg.addColorStop(.17,bc);bg.addColorStop(.88,bc);bg.addColorStop(1,t.top);
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  }
  const top=t.lay==='ministry'?260:340,bot=t.lay==='ministry'?1740:1700;
  if(t.lay==='ministry'){
    const ph=(bot-top-gap)/2,y2=top+ph+gap;
    photo(imgs.a,'الصورة الأولى',0,top,W,ph,tint,bc);
    edge(0,top,W,ph,'bottom',fs,bc,st);
    photo(imgs.b,'الصورة الثانية',0,y2,W,ph,tint,bc);
    edge(0,y2,W,ph,'top',fs,bc,st);
    edge(0,y2,W,ph,'bottom',Math.min(fs,140),t.mid,st);
  }else if(t.lay==='stack'){
    const ph=(bot-top-gap)/2,y2=top+ph+gap;
    photo(imgs.a,'الصورة الأولى',0,top,W,ph,tint,bc);
    edge(0,top,W,ph,'top',fs,bc,st);edge(0,top,W,ph,'bottom',fs,bc,st);
    photo(imgs.b,'الصورة الثانية',0,y2,W,ph,tint,bc);
    edge(0,y2,W,ph,'top',fs,bc,st);edge(0,y2,W,ph,'bottom',fs,bc,st);
  }else if(t.lay==='split'){
    const y=top+20,h=bot-y,w=(W-gap)/2;
    photo(imgs.a,'الصورة الأولى',0,y,w,h,tint,bc);
    edge(0,y,w,h,'right',fs,bc,st);edge(0,y,w,h,'top',fs*.8,bc,st);edge(0,y,w,h,'bottom',fs*.8,bc,st);
    photo(imgs.b,'الصورة الثانية',w+gap,y,w,h,tint,bc);
    edge(w+gap,y,w,h,'left',fs,bc,st);edge(w+gap,y,w,h,'top',fs*.8,bc,st);edge(w+gap,y,w,h,'bottom',fs*.8,bc,st);
  }else{
    const m=70,w=W-m*2,ph=(bot-top-gap-20)/2,r=fs/320*90,y2=top+ph+gap+20;
    [[imgs.a,'الصورة الأولى',top],[imgs.b,'الصورة الثانية',y2]].forEach(([im,l,y])=>{
      ctx.save();ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=40;ctx.shadowOffsetY=12;ctx.fillStyle='#000';rr(m,y,w,ph,r);ctx.fill();ctx.restore();
      photo(im,l,m,y,w,ph,tint,bc,r);
      ctx.strokeStyle=t.acc;ctx.lineWidth=4;rr(m,y,w,ph,r);ctx.stroke();
    });
  }
  ctx.textAlign='center';
  if(t.lay==='ministry'){
    const logo=imgs.l2White||imgs.l2;
    if(logo){const w=300,hh=w*logo.height/logo.width;ctx.drawImage(logo,(W-w)/2,24,w,hh)}
    ctx.fillStyle=t.acc;fit(t.schoolName,W-100,64,800);ctx.fillText(t.schoolName,W/2,1855);
  }else{
    const L1=imgs.l1,L2=imgs.l2;
    if(L1){const w=250,hh=w*L1.height/L1.width;ctx.drawImage(L1,W-60-w,70,w,hh)}
    if(L2){const w=270,hh=w*L2.height/L2.width;ctx.drawImage(L2,60,90,w,hh)}
    ctx.fillStyle=t.acc;fit($('title').value,W-140,76,800);ctx.fillText($('title').value,W/2,1775);
    ctx.fillStyle=t.sub;fit($('sub').value,W-160,42,400);ctx.fillText($('sub').value,W/2,1835);
  }
  $('dl').disabled=!(imgs.a||imgs.b);
}
['fs','fstyle','bc','tint','gap','title','sub'].forEach(i=>$(i).addEventListener('input',draw));

$('aiBtn').onclick=async()=>{
  if(!files.a&&!files.b){msg('ارفع صورة واحدة على الأقل أولاً.');return}
  const sample=typeof claude!=='undefined'?await claude.use('sample'):null;
  if(!sample){msg('ميزة الذكاء الاصطناعي غير متاحة في هذا العرض. يمكنك كتابة العنوان يدويًا.');return}
  $('aiBtn').disabled=true;msg('جارٍ تحليل الصور وكتابة العنوان…');
  try{
    const blobs=[files.a,files.b].filter(Boolean);
    const lim=await sample.limits();
    const useImgs=lim&&lim.images;
    const prompt=`أنت محرر في مدرسة ثانوية سعودية. اكتب عنوانًا قصيرًا (لا يزيد عن 5 كلمات) وسطرًا فرعيًا قصيرًا (لا يزيد عن 10 كلمات) لبوست مدرسي رسمي بالعربية الفصحى.
وصف المناسبة من المستخدم: ${$('desc').value||'غير مذكور'}
${useImgs?'استند إلى مضمون الصور المرفقة، ولا تذكر أسماء أشخاص.':''}
أجب بـ JSON فقط بالشكل: {"title":"...","subtitle":"..."}`;
    const r=await sample(prompt,useImgs?{images:blobs,cache:false}:{cache:false});
    const j=JSON.parse(r.text.replace(/```json|```/g,'').trim());
    if(j.title)$('title').value=j.title;
    if(j.subtitle)$('sub').value=j.subtitle;
    msg('تم ✓ يمكنك تعديل النص قبل الحفظ.');draw();
  }catch(e){msg(e&&e.code==='not_granted'?'لم يتم السماح باستخدام الذكاء الاصطناعي.':'تعذّر التوليد، حاول مرة أخرى.')}
  $('aiBtn').disabled=false;
};

$('dl').onclick=async()=>{
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  try{
    const d=await claude.use('downloads');
    if(d){await d.save({filename:'arn-studio-post.png',data:blob});return}
  }catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='arn-studio-post.png';a.click();
};
buildTpls();
Promise.all(Object.entries(LOGOS).map(async([k,u])=>{const i=new Image();i.src=u;await i.decode();imgs[k]=i})).then(()=>{imgs.l2White=tintImage(imgs.l2,'#ffffff');draw()});
draw();
</script>
